# =====================================================================
# AndesStay - RabbitMQ en clúster de 2 nodos  (EC2 "ec2-mq")
#
# Levantar (desde la carpeta infra-andesstay-messaging):
#   docker compose -f mq/compose.yml --env-file .env up -d
#
# Verificar que los dos nodos forman UN clúster:
#   docker exec rabbitmq-1 rabbitmqctl cluster_status
#
# Consola de administración (usuario/clave del archivo .env):
#   nodo 1 -> http://<host>:15672      nodo 2 -> http://<host>:15673
#
# Puertos AMQP para los microservicios:
#   nodo 1 -> 5672                     nodo 2 -> 5673
# =====================================================================
name: andesstay-mq

# Configuración común de los dos nodos (se reutiliza con <<: *rabbit-node)
x-rabbit-node: &rabbit-node
  image: rabbitmq:4.2-management
  environment:
    RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-andesstay}
    RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD en el archivo .env}
    # La cookie de Erlang es el "secreto" que comparten los nodos del clúster.
    RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Define RABBITMQ_ERLANG_COOKIE en el archivo .env}
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 20s
  restart: unless-stopped

services:

  rabbitmq-1:
    <<: *rabbit-node
    container_name: rabbitmq-1
    hostname: rabbitmq-1
    ports:
      - "5672:5672"     # AMQP (microservicios)
      - "15672:15672"   # Management UI
    volumes:
      - rabbitmq_data_1:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/30-andesstay-cluster.conf:ro

  rabbitmq-2:
    <<: *rabbit-node
    container_name: rabbitmq-2
    hostname: rabbitmq-2
    ports:
      - "5673:5672"     # AMQP del nodo 2 (en el host se publica en 5673)
      - "15673:15672"   # Management UI del nodo 2
    volumes:
      - rabbitmq_data_2:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/30-andesstay-cluster.conf:ro
    # El nodo 2 parte cuando el nodo 1 ya está sano, así se une a su clúster.
    depends_on:
      rabbitmq-1:
        condition: service_healthy

volumes:
  rabbitmq_data_1:
  rabbitmq_data_2:
