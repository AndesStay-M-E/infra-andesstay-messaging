# =====================================================================
# Clúster RabbitMQ de AndesStay (2 nodos).
#
# Los nodos se encuentran con una lista fija de nombres ("classic config").
# Para formar el clúster, los dos nodos deben:
#   1. Tener la MISMA cookie de Erlang (RABBITMQ_ERLANG_COOKIE en .env).
#   2. Poder resolver el nombre del otro (rabbitmq-1 y rabbitmq-2 están en
#      la misma red de Docker, por eso se resuelven por nombre).
#
# Verificar:  docker exec rabbitmq-1 rabbitmqctl cluster_status
#
# OJO: este archivo solo acepta claves válidas de RabbitMQ 4.x. Una clave
# inventada (por ejemplo "queue_master_location") hace que el nodo no inicie.
# =====================================================================
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2
