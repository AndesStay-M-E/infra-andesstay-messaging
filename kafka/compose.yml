# =====================================================================
# AndesStay - Kafka  (EC2 "ec2-kafka")
#
#   3 nodos ZooKeeper  -> guardan los metadatos del clúster y eligen al
#                         broker "controller". Con 3 nodos hay quórum
#                         (mayoría = 2): si cae 1 ZooKeeper el clúster sigue.
#   3 brokers Kafka    -> guardan las particiones. Con réplicas = 3 cada
#                         partición tiene 1 líder + 2 seguidores (ISR).
#   Kafka UI           -> interfaz web para ver brokers, tópicos, mensajes,
#                         consumer groups, offsets y lag.
#   kafka-init         -> contenedor de una sola ejecución que crea los
#                         tópicos de AndesStay (3 particiones, 3 réplicas).
#
# Levantar (desde la carpeta infra-andesstay-messaging):
#   docker compose -f kafka/compose.yml --env-file .env up -d
#
# Kafka UI:  http://<host>:8090   (usuario/clave de KAFKA_UI_USER / KAFKA_UI_PASSWORD)
#
# Listeners de cada broker:
#   PLAINTEXT       kafka-N:29092                       -> dentro de Docker
#   PLAINTEXT_HOST  ${KAFKA_ADVERTISED_HOST}:9092/93/94 -> desde fuera de Docker
#                   (en AWS = IP privada de ec2-kafka; en el PC = localhost)
# =====================================================================
name: andesstay-kafka

# ---------- Configuración común de ZooKeeper ----------
x-zookeeper-env: &zookeeper-env
  ZOOKEEPER_CLIENT_PORT: 2181
  ZOOKEEPER_TICK_TIME: 2000
  ZOOKEEPER_INIT_LIMIT: 5
  ZOOKEEPER_SYNC_LIMIT: 2
  # Los 3 nodos del "ensemble" (puerto 2888 = réplica, 3888 = elección de líder)
  ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
  KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"

# ---------- Configuración común de los brokers ----------
x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  # Los tópicos se crean a propósito (kafka-init / Kafka UI / ms-andesstay-kafka-admin).
  # Así un error de tipeo en un microservicio no crea un tópico "fantasma".
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_NUM_PARTITIONS: 3
  # acks=all del productor + min.insync.replicas=2 => se puede escribir con 1 broker caído.
  KAFKA_MIN_INSYNC_REPLICAS: 2
  # Tópicos internos (offsets de los consumer groups) también replicados en los 3 brokers.
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

x-kafka-healthcheck: &kafka-healthcheck
  test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1"]
  interval: 15s
  timeout: 15s
  retries: 12
  start_period: 30s

services:

  # =================== ZOOKEEPER (3 nodos) ===================
  zookeeper-1:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper-1
    hostname: zookeeper-1
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 1
    volumes:
      - zookeeper1_data:/var/lib/zookeeper/data
      - zookeeper1_log:/var/lib/zookeeper/log
    restart: unless-stopped

  zookeeper-2:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper-2
    hostname: zookeeper-2
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 2
    volumes:
      - zookeeper2_data:/var/lib/zookeeper/data
      - zookeeper2_log:/var/lib/zookeeper/log
    restart: unless-stopped

  zookeeper-3:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper-3
    hostname: zookeeper-3
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 3
    volumes:
      - zookeeper3_data:/var/lib/zookeeper/data
      - zookeeper3_log:/var/lib/zookeeper/log
    restart: unless-stopped

  # =================== BROKERS KAFKA (3 nodos) ===================
  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-1
    hostname: kafka-1
    depends_on: [zookeeper-1, zookeeper-2, zookeeper-3]
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://${KAFKA_ADVERTISED_HOST:-localhost}:9092
    volumes:
      - kafka1_data:/var/lib/kafka/data
    healthcheck: *kafka-healthcheck
    restart: unless-stopped

  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-2
    hostname: kafka-2
    depends_on: [zookeeper-1, zookeeper-2, zookeeper-3]
    ports:
      - "9093:9093"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29092,PLAINTEXT_HOST://${KAFKA_ADVERTISED_HOST:-localhost}:9093
    volumes:
      - kafka2_data:/var/lib/kafka/data
    healthcheck: *kafka-healthcheck
    restart: unless-stopped

  kafka-3:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-3
    hostname: kafka-3
    depends_on: [zookeeper-1, zookeeper-2, zookeeper-3]
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:29092,PLAINTEXT_HOST://${KAFKA_ADVERTISED_HOST:-localhost}:9094
    volumes:
      - kafka3_data:/var/lib/kafka/data
    healthcheck: *kafka-healthcheck
    restart: unless-stopped

  # =================== CREACIÓN DE TÓPICOS ===================
  # Se ejecuta una vez cuando los 3 brokers están sanos y termina (Exited 0).
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    volumes:
      - ./create-topics.sh:/scripts/create-topics.sh:ro
    entrypoint: ["bash", "/scripts/create-topics.sh"]
    restart: "no"

  # =================== KAFKA UI ===================
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: andesstay
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      # Login simple para que nadie más entre a la UI cuando esté en AWS.
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USER:-admin}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:?Define KAFKA_UI_PASSWORD en el archivo .env}
    restart: unless-stopped

volumes:
  zookeeper1_data:
  zookeeper1_log:
  zookeeper2_data:
  zookeeper2_log:
  zookeeper3_data:
  zookeeper3_log:
  kafka1_data:
  kafka2_data:
  kafka3_data:
