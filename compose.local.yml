# =====================================================================
# AndesStay - TODO en un solo computador (tu PC con Docker Desktop)
#
# Junta los tres compose del caso:
#   mq/compose.yml     -> RabbitMQ (2 nodos en clúster)
#   kafka/compose.yml  -> 3 ZooKeeper + 3 brokers + Kafka UI + creación de tópicos
#   apps/compose.yml   -> los 8 microservicios
#
# Desde la carpeta infra-andesstay-messaging:
#   1) copy .env.example .env        (Windows)   |  cp .env.example .env (Linux/Mac)
#   2) docker compose -f compose.local.yml up -d --build
#   3) docker compose -f compose.local.yml ps
#
# URLs:
#   BFF ............ http://localhost:8080/actuator/health
#   RabbitMQ ....... http://localhost:15672  y  http://localhost:15673
#   Kafka UI ....... http://localhost:8090
#   Frontend ....... npm start en frontend-andesstay -> http://localhost:4200
#
# Apagar:             docker compose -f compose.local.yml down
# Apagar y BORRAR:    docker compose -f compose.local.yml down -v
# =====================================================================
name: andesstay

include:
  - path: mq/compose.yml
    env_file: .env
  - path: kafka/compose.yml
    env_file: .env
  - path:
      - apps/compose.yml
      - apps/compose.local-wait.yml
    env_file: .env
